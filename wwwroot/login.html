<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Вход</h1>
    <div class="form-group">
        <label>Логин:</label>
        <input type="text" id="login" placeholder="Логин">
    </div>
    <div class="form-group">
        <label>Пароль:</label>
        <input type="password" id="password" placeholder="Пароль">
    </div>
    <button id="loginBtn">Войти</button>
    <div id="message" class="error"></div>
    <div class="form-group" style="margin-top: 20px;">
        <button onclick="location.href='register.html'">Нет аккаунта? Зарегистрируйтесь</button>
        <button onclick="location.href='index.html'">На главную</button>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userLogin', data.login);
                messageDiv.className = 'success';
                messageDiv.innerText = 'Вход выполнен!';
                setTimeout(() => { location.href = 'quest.html'; }, 1000);
            } else {
                const error = await response.text();
                messageDiv.innerText = error || 'Неверный логин или пароль';
            }
        });
    </script>
</body>
</html>
